<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">luanthnh — Creative Frontend Developer</title>
<desc id="desc">Alive Interface banner with a flat counter-rotating portfolio mark and angular signal bus.</desc>
<defs>
  <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" stroke="#F3F0EA" stroke-opacity=".034"/>
  </pattern>
  <pattern id="major-grid" width="120" height="120" patternUnits="userSpaceOnUse">
    <path d="M120 0H0V120" stroke="#F3F0EA" stroke-opacity=".052"/>
  </pattern>
  <linearGradient id="lime-line" x1="82" y1="0" x2="1518" y2="0">
    <stop stop-color="#C8FF4D" stop-opacity="0"/>
    <stop offset=".15" stop-color="#C8FF4D"/>
    <stop offset=".8" stop-color="#C8FF4D"/>
    <stop offset="1" stop-color="#C8FF4D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hero-scan" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#C8FF4D" stop-opacity="0"/>
    <stop offset=".5" stop-color="#C8FF4D" stop-opacity=".24"/>
    <stop offset="1" stop-color="#C8FF4D" stop-opacity="0"/>
  </linearGradient>
  <filter id="hero-glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="hero-mark-clip">
    <path fill-rule="evenodd" clip-rule="evenodd"
      d="M39 52H88L106 70L107 52H116L117 99L98 119L116 120L117 129H68L49 111L48 129H39V81L57 63L39 61V52ZM59 62L58 100L50 109L88 110L96 118L97 81L105 72L68 71L59 62Z"/>
  </clipPath>
  <style>
    .display { font-family:Arial Narrow,Helvetica Neue,Arial,sans-serif; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    @keyframes grid-move { from {transform:translate(0,0)} to {transform:translate(24px,24px)} }
    @keyframes scan-move { from {transform:translateX(-340px);opacity:0} 18% {opacity:.6} to {transform:translateX(1940px);opacity:0} }
    @keyframes mark-draw { from {stroke-dashoffset:620;opacity:.15} to {stroke-dashoffset:0;opacity:1} }
    @keyframes core-pulse { 0%,100% {opacity:.5} 50% {opacity:1} }
    @keyframes orbit-dash { from {stroke-dashoffset:0} to {stroke-dashoffset:-420} }
    @keyframes orbit-dash-r { from {stroke-dashoffset:0} to {stroke-dashoffset:420} }
    @keyframes mark-rotate-reverse { from {transform:rotate(0deg)} to {transform:rotate(-360deg)} }
    @keyframes bus-flow { from {stroke-dashoffset:0} to {stroke-dashoffset:-260} }
    @keyframes bus-node { 0%,100% {opacity:.42} 50% {opacity:1} }
    @keyframes status-pulse { 0%,100% {opacity:.36} 50% {opacity:1} }
    .grid-layer { animation:grid-move 18s linear infinite; }
    .scan-layer { animation:scan-move 7.4s ease-in-out infinite; }
    .mark-outline { stroke-dasharray:620;animation:mark-draw 2s cubic-bezier(.2,.8,.2,1) both; }
    .mark-core { animation:core-pulse 2.1s ease-in-out infinite; }
    .orbit-a { animation:orbit-dash 16s linear infinite; }
    .orbit-b { animation:orbit-dash-r 22s linear infinite; }
    .mark-rotate {
      transform-box:fill-box;
      transform-origin:center;
      animation:mark-rotate-reverse 18s linear infinite;
    }
    .bus-flow {
      stroke-dasharray:34 226;
      animation:bus-flow 5.8s linear infinite;
    }
    .bus-node { animation:bus-node 2.4s ease-in-out infinite; }
    .status { animation:status-pulse 2.3s ease-in-out infinite; }
    @media (prefers-reduced-motion:reduce) { * {animation:none !important;} }
  </style>
</defs>
<rect width="1600" height="560" fill="#080808"/>
<g class="grid-layer"><rect x="-24" y="-24" width="1648" height="608" fill="url(#micro-grid)"/></g>
<rect width="1600" height="560" fill="url(#major-grid)"/>
<rect class="scan-layer" x="-330" width="330" height="560" fill="url(#hero-scan)"/>

<rect x="20" y="20" width="1560" height="520" stroke="#2C302C"/>
<path d="M20 44V20H44M1556 20H1580V44M20 516V540H44M1556 540H1580V516" stroke="#C8FF4D" stroke-width="1.6"/>
<path d="M20 92H1580M20 474H1580" stroke="#F3F0EA" stroke-opacity=".12"/>
<path d="M82 20V540M976 20V540M1518 20V540" stroke="#F3F0EA" stroke-opacity=".075"/>

<text x="82" y="66" fill="#8A8E86" class="mono" font-size="12" letter-spacing="2.4">LUANTHNH / PORTFOLIO INTERFACE / 2026</text>
<circle cx="1466" cy="59" r="5" fill="#C8FF4D" class="status" filter="url(#hero-glow)"/>
<text x="1448" y="64" text-anchor="end" fill="#8A8E86" class="mono" font-size="11" letter-spacing="1.7">SIGNAL ONLINE</text>

<text x="74" y="246" fill="#F3F0EA" class="display" font-size="132" font-weight="800" letter-spacing="-8">LUANTHNH</text>
<path d="M80 270H872" stroke="url(#lime-line)" stroke-width="2"/>
<text x="82" y="316" fill="#C8FF4D" class="mono" font-size="15" font-weight="700" letter-spacing="2.2">CREATIVE FRONTEND / PRODUCT SYSTEMS / AUTOMATION</text>
<text x="82" y="354" fill="#A2A49E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Interfaces that think. Motion that explains. Systems that last.</text>

<g transform="translate(82 392)">
  <rect width="150" height="34" fill="none" stroke="#30342F"/>
  <text x="75" y="22" text-anchor="middle" fill="#D8D9D4" class="mono" font-size="10" letter-spacing="1.2">REACT / NEXT</text>
  <g transform="translate(164)"><rect width="142" height="34" fill="none" stroke="#30342F"/><text x="71" y="22" text-anchor="middle" fill="#D8D9D4" class="mono" font-size="10" letter-spacing="1.2">NUXT / NODE</text></g>
  <g transform="translate(320)"><rect width="156" height="34" fill="none" stroke="#30342F"/><text x="78" y="22" text-anchor="middle" fill="#D8D9D4" class="mono" font-size="10" letter-spacing="1.2">PYTHON / TOOLS</text></g>
  <g transform="translate(490)"><rect width="154" height="34" fill="#C8FF4D"/><text x="77" y="22" text-anchor="middle" fill="#080808" class="mono" font-size="10" font-weight="800" letter-spacing="1.2">SHIP / REFINE</text></g>
</g>

<!-- Fixed-position logo area. Parent transform is static; animation only changes stroke/fill. -->
<g transform="translate(1152 104) scale(2.22)">
  <circle cx="78" cy="90" r="75" fill="none" stroke="#F3F0EA" stroke-opacity=".09"/>
  <circle class="orbit-a" cx="78" cy="90" r="64" fill="none" stroke="#C8FF4D" stroke-opacity=".44" stroke-width=".8" stroke-dasharray="3 8"/>
  <circle class="orbit-b" cx="78" cy="90" r="54" fill="none" stroke="#F3F0EA" stroke-opacity=".18" stroke-width=".8" stroke-dasharray="18 9"/>
  <g class="mark-rotate">
    <g fill="#C8FF4D">
<g id="portfolio-mark">
  <path id="mark-main" fill-rule="evenodd" clip-rule="evenodd"
    d="M39 52H88L106 70L107 52H116L117 99L98 119L116 120L117 129H68L49 111L48 129H39V81L57 63L39 61V52ZM59 62L58 100L50 109L88 110L96 118L97 81L105 72L68 71L59 62Z"/>
  <rect id="mark-core-frame" x="69.5" y="81.5" width="17" height="18" rx="4.8" fill="#C8FF4D"/>
  <rect id="mark-core-hole" x="73.5" y="85.5" width="9" height="10" rx="2.2" fill="#080808"/>
</g>
</g>
  <path class="mark-outline" d="M39 52H88L106 70L107 52H116L117 99L98 119L116 120L117 129H68L49 111L48 129H39V81L57 63L39 61V52" fill="none" stroke="#F3F0EA" stroke-opacity=".52" stroke-width=".75"/>
  <g class="mark-core">
    <rect x="69.5" y="81.5" width="17" height="18" rx="4.8" fill="#C8FF4D"/>
    <rect x="73.5" y="85.5" width="9" height="10" rx="2.2" fill="#080808"/>
  </g>
  </g>
  <circle cx="20" cy="90" r="2.5" fill="#C8FF4D" class="status"/>
  <circle cx="136" cy="90" r="2.5" fill="#C8FF4D" class="status"/>
</g>

<text x="1034" y="126" fill="#777B74" class="mono" font-size="10" letter-spacing="1.5">PORTFOLIO MARK / MOTION IDENTITY</text>
<g aria-label="Design motion engineering signal bus">
  <path d="M1026 418H1110L1132 400H1208L1230 418H1318L1340 400H1418L1440 418H1494"
        stroke="#30352F" stroke-width="1.4" fill="none"/>
  <path class="bus-flow"
        d="M1026 418H1110L1132 400H1208L1230 418H1318L1340 400H1418L1440 418H1494"
        stroke="#C8FF4D" stroke-width="2.2" fill="none"/>
  <rect x="1127" y="395" width="10" height="10" fill="#080808" stroke="#C8FF4D" class="bus-node"/>
  <rect x="1225" y="413" width="10" height="10" fill="#080808" stroke="#C8FF4D" class="bus-node" style="animation-delay:-.8s"/>
  <rect x="1335" y="395" width="10" height="10" fill="#080808" stroke="#C8FF4D" class="bus-node" style="animation-delay:-1.6s"/>
  <text x="1132" y="449" text-anchor="middle" fill="#777B74" class="mono" font-size="9" letter-spacing="1.5">DESIGN</text>
  <text x="1230" y="449" text-anchor="middle" fill="#777B74" class="mono" font-size="9" letter-spacing="1.5">MOTION</text>
  <text x="1340" y="449" text-anchor="middle" fill="#777B74" class="mono" font-size="9" letter-spacing="1.5">ENGINEERING</text>
  <text x="1494" y="449" text-anchor="end" fill="#555A54" class="mono" font-size="8" letter-spacing="1.2">BUS / 03</text>
</g>

<path d="M82 494H1518" stroke="url(#lime-line)"/>
<text x="82" y="524" fill="#6F736C" class="mono" font-size="10" letter-spacing="1.5">16.0544° N / 108.2022° E / DA NANG, VIET NAM</text>
<text x="1518" y="524" text-anchor="end" fill="#6F736C" class="mono" font-size="10" letter-spacing="1.5">THE INTERFACE IS ALIVE / GITHUB.COM/LUAN-THNH</text>
</svg>