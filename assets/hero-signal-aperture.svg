<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">luanthnh — Creative Frontend Developer</title>
<desc id="desc">An editorial Alive Interface banner with a folded aperture, technical grid, living signal and animated system annotations.</desc>
<defs>
  <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" stroke="#F3F0EA" stroke-opacity=".034"/>
  </pattern>
  <pattern id="majorGrid" width="120" height="120" patternUnits="userSpaceOnUse">
    <path d="M120 0H0V120" stroke="#F3F0EA" stroke-opacity=".055"/>
  </pattern>
  <linearGradient id="limeLine" x1="82" y1="0" x2="1518" y2="0">
    <stop stop-color="#C8FF4D" stop-opacity="0"/>
    <stop offset=".14" stop-color="#C8FF4D"/>
    <stop offset=".78" stop-color="#C8FF4D"/>
    <stop offset="1" stop-color="#C8FF4D" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="foldA" x1="1110" y1="116" x2="1370" y2="442" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F3F0EA" stop-opacity=".98"/>
    <stop offset=".42" stop-color="#9A9D94" stop-opacity=".34"/>
    <stop offset="1" stop-color="#090A09" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="foldB" x1="1310" y1="80" x2="1050" y2="442" gradientUnits="userSpaceOnUse">
    <stop stop-color="#C8FF4D" stop-opacity=".9"/>
    <stop offset=".5" stop-color="#C8FF4D" stop-opacity=".17"/>
    <stop offset="1" stop-color="#C8FF4D" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="aura">
    <stop stop-color="#C8FF4D" stop-opacity=".18"/>
    <stop offset=".48" stop-color="#C8FF4D" stop-opacity=".06"/>
    <stop offset="1" stop-color="#C8FF4D" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#C8FF4D" stop-opacity="0"/>
    <stop offset=".48" stop-color="#C8FF4D" stop-opacity=".02"/>
    <stop offset=".5" stop-color="#C8FF4D" stop-opacity=".26"/>
    <stop offset=".52" stop-color="#C8FF4D" stop-opacity=".02"/>
    <stop offset="1" stop-color="#C8FF4D" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect x="20" y="20" width="1560" height="520"/></clipPath>
  <style>
    .display { font-family: Arial Narrow, Helvetica Neue, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @keyframes scanMove { from { transform:translateX(-360px); opacity:0; } 12% {opacity:.72} 75% {opacity:.28} to {transform:translateX(1920px); opacity:0;} }
    @keyframes orbit { to { transform:rotate(360deg); } }
    @keyframes orbitReverse { to { transform:rotate(-360deg); } }
    @keyframes pulse { 0%,100%{opacity:.45;transform:scale(.82)} 50%{opacity:1;transform:scale(1.22)} }
    @keyframes breathe { 0%,100%{opacity:.68;transform:scale(.97)} 50%{opacity:1;transform:scale(1.035)} }
    @keyframes lineDraw { from{stroke-dashoffset:1300;opacity:.15} to{stroke-dashoffset:0;opacity:1} }
    @keyframes drift { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes blink { 0%,46%{opacity:1} 47%,100%{opacity:0} }
    @keyframes gridDrift { from{transform:translate(0,0)} to{transform:translate(24px,24px)} }
    .scan { animation:scanMove 7.5s cubic-bezier(.3,0,.2,1) infinite; }
    .orbit { transform-box:fill-box;transform-origin:center;animation:orbit 22s linear infinite; }
    .orbit-r { transform-box:fill-box;transform-origin:center;animation:orbitReverse 29s linear infinite; }
    .pulse { transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite; }
    .breathe { transform-box:fill-box;transform-origin:center;animation:breathe 4.8s ease-in-out infinite; }
    .draw { stroke-dasharray:1300;animation:lineDraw 2.2s cubic-bezier(.22,.82,.2,1) both; }
    .drift { animation:drift 5.8s ease-in-out infinite; }
    .blink { animation:blink 1.1s steps(1,end) infinite; }
    .grid { animation:gridDrift 18s linear infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
</defs>

<rect width="1600" height="560" fill="#080808"/>
<g clip-path="url(#frame)">
  <g class="grid"><rect x="-24" y="-24" width="1648" height="608" fill="url(#microGrid)"/></g>
  <rect width="1600" height="560" fill="url(#majorGrid)"/>
  <ellipse cx="1264" cy="274" rx="360" ry="330" fill="url(#aura)"/>
  <rect class="scan" x="-330" y="0" width="330" height="560" fill="url(#scan)"/>

  <path d="M20 92H1580M20 474H1580" stroke="#F3F0EA" stroke-opacity=".12"/>
  <path d="M82 20V540M980 20V540M1518 20V540" stroke="#F3F0EA" stroke-opacity=".075"/>
  <path d="M82 112H1518" stroke="#F3F0EA" stroke-opacity=".05" stroke-dasharray="4 10"/>
  <path d="M82 418H1518" stroke="#F3F0EA" stroke-opacity=".05" stroke-dasharray="4 10"/>

  <!-- left editorial identity -->
  <text x="82" y="66" fill="#8A8E86" class="mono" font-size="12" letter-spacing="2.4">LUANTHNH / ALIVE INTERFACE PROFILE / 2026</text>
  <circle cx="1464" cy="59" r="5" fill="#C8FF4D" class="pulse" filter="url(#glow)"/>
  <text x="1448" y="64" text-anchor="end" fill="#8A8E86" class="mono" font-size="11" letter-spacing="1.7">SIGNAL ONLINE</text>

  <text x="74" y="246" fill="#F3F0EA" class="display" font-size="132" font-weight="800" letter-spacing="-8">LUANTHNH</text>
  <path d="M80 270H872" stroke="url(#limeLine)" stroke-width="2"/>
  <text x="82" y="316" fill="#C8FF4D" class="mono" font-size="15" font-weight="700" letter-spacing="2.2">CREATIVE FRONTEND / PRODUCT SYSTEMS / AUTOMATION</text>
  <text x="82" y="354" fill="#A2A49E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Interfaces that think. Motion that explains. Systems that last.</text>

  <g transform="translate(82 392)">
    <rect width="150" height="34" fill="none" stroke="#30342F"/>
    <text x="75" y="22" text-anchor="middle" fill="#D8D9D4" class="mono" font-size="10" letter-spacing="1.2">REACT / NEXT</text>
    <g transform="translate(164)">
      <rect width="142" height="34" fill="none" stroke="#30342F"/>
      <text x="71" y="22" text-anchor="middle" fill="#D8D9D4" class="mono" font-size="10" letter-spacing="1.2">NUXT / NODE</text>
    </g>
    <g transform="translate(320)">
      <rect width="156" height="34" fill="none" stroke="#30342F"/>
      <text x="78" y="22" text-anchor="middle" fill="#D8D9D4" class="mono" font-size="10" letter-spacing="1.2">PYTHON / TOOLS</text>
    </g>
    <g transform="translate(490)">
      <rect width="154" height="34" fill="#C8FF4D"/>
      <text x="77" y="22" text-anchor="middle" fill="#080808" class="mono" font-size="10" font-weight="800" letter-spacing="1.2">SHIP / REFINE</text>
    </g>
  </g>

  <!-- right signature: folded aperture -->
  <g transform="translate(1244 278)" class="drift">
    <circle r="184" fill="none" stroke="#F3F0EA" stroke-opacity=".09"/>
    <circle r="144" fill="none" stroke="#C8FF4D" stroke-opacity=".42" stroke-dasharray="3 13" class="orbit"/>
    <circle r="104" fill="none" stroke="#F3F0EA" stroke-opacity=".18" stroke-dasharray="48 18" class="orbit-r"/>
    <path d="M0 -176L176 0L0 176L-176 0Z" fill="none" stroke="#F3F0EA" stroke-opacity=".16" class="orbit-r"/>
    <path d="M0 -132L132 0L0 132L-132 0Z" fill="none" stroke="#C8FF4D" stroke-opacity=".55" class="orbit"/>
    <g class="breathe">
      <path d="M0 -116L102 -18L28 98L-94 26Z" fill="url(#foldA)" fill-opacity=".74"/>
      <path d="M0 -116L28 98L-20 18L-94 26Z" fill="#080808" fill-opacity=".82"/>
      <path d="M0 -116L102 -18L-20 18Z" fill="url(#foldB)" fill-opacity=".82"/>
      <path d="M-20 18L102 -18L28 98Z" fill="#C8FF4D" fill-opacity=".13"/>
      <path d="M0 -116L102 -18L28 98L-94 26Z" fill="none" stroke="#F3F0EA" stroke-opacity=".42"/>
    </g>
    <circle r="10" fill="#080808" stroke="#C8FF4D" stroke-width="3" class="pulse" filter="url(#glow)"/>
    <circle cx="-132" cy="-64" r="5" fill="#080808" stroke="#C8FF4D" stroke-width="2"/>
    <circle cx="148" cy="82" r="5" fill="#C8FF4D"/>
    <path class="draw" d="M-190 94C-128 94 -126 -64 -62 -64C20 -64 4 120 92 120C142 120 144 82 148 82" stroke="#C8FF4D" stroke-width="2.4" fill="none"/>
  </g>

  <text x="1026" y="130" fill="#777B74" class="mono" font-size="10" letter-spacing="1.5">FOLDED APERTURE / SIGNATURE SYSTEM</text>
  <text x="1494" y="450" text-anchor="end" fill="#777B74" class="mono" font-size="10" letter-spacing="1.5">DESIGN → MOTION → ENGINEERING</text>
  <rect x="1498" y="440" width="8" height="16" fill="#C8FF4D" class="blink"/>

  <!-- bottom rail -->
  <path d="M82 494H1518" stroke="url(#limeLine)"/>
  <text x="82" y="524" fill="#6F736C" class="mono" font-size="10" letter-spacing="1.5">16.0544° N / 108.2022° E / DA NANG, VIET NAM</text>
  <text x="1518" y="524" text-anchor="end" fill="#6F736C" class="mono" font-size="10" letter-spacing="1.5">THE INTERFACE IS ALIVE / GITHUB.COM/LUAN-THNH</text>
</g>
<rect x="20" y="20" width="1560" height="520" fill="none" stroke="#2C302C"/>
<path d="M20 44V20H44M1556 20H1580V44M20 516V540H44M1556 540H1580V516" stroke="#C8FF4D" stroke-width="1.6"/>
</svg>